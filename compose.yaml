name: whatsappka

# Локальные PostgreSQL, Redis, MinIO и одноразовые миграции.
# Остановка и docker compose down не удаляют именованные volumes.

# Ротация логов контейнеров: без неё json-file растёт без предела и съедает диск VM (PRD §11.1).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  # Внутренняя сеть: БД, Redis, S3, миграции и почта. Наружу не выходит.
  private:
    internal: true
  # Обычная сеть: только приложения, которым нужен выход наружу (Google OIDC, SMTP) и опубликованный порт статики.
  edge:
    driver: bridge

volumes:
  postgres-data:
    name: whatsappka-postgres
  redis-data:
    name: whatsappka-redis
  minio-data:
    name: whatsappka-minio

services:
  postgres:
    logging: *logging
    image: postgres:17.11@sha256:86fa57b44a1d38f09970f64ac71eb492f7a9cf94d08b85e1c8f07bb0fc0a1761
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatsappka}
      POSTGRES_USER: ${POSTGRES_USER:-whatsappka_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?DB_MIGRATION_PASSWORD is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - private
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && PGPASSWORD="$$POSTGRES_PASSWORD" psql --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'whatsappka_migrate'" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  redis:
    logging: *logging
    image: redis:8.10.2@sha256:9b838698c59be36d7eb03edcb8dc210c49b91240b92889d0c37d8e29ce3eb12b
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-lru
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  migrate:
    logging: *logging
    image: flyway/flyway:13.9.0@sha256:37a6264058aa02ec8def04dd27770dd22ba835b3d73941f9d492b122c70410ad
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-whatsappka}
      FLYWAY_USER: whatsappka_migrate
      FLYWAY_PASSWORD: ${DB_MIGRATION_PASSWORD:?DB_MIGRATION_PASSWORD is required}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "30"
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql:ro
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    logging: *logging
    image: whatsappka-minio:9e49d5e7a648
    platform: linux/arm64
    build:
      context: ./infra/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER: "off"
    command: ["minio", "server", "/data", "--address", ":9000"]
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
    networks:
      - private
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  minio-init:
    logging: *logging
    image: whatsappka-minio:9e49d5e7a648
    platform: linux/arm64
    build:
      context: ./infra/minio
    entrypoint: ["/usr/local/bin/init-bucket.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-whatsappka-media}
    networks:
      - private
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  backend:
    logging: *logging
    build:
      context: ./backend
    image: whatsappka-backend:local
    environment:
      SPRING_PROFILES_ACTIVE: backend
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-whatsappka}
      DB_USERNAME: ${DB_USERNAME:-whatsappka_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-whatsappka-media}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WHATSAPPKA_SECURITY_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WHATSAPPKA_SECURITY_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
      # false нужен для входа по http в локальной сети; за HTTPS ставьте true.
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
      APP_URL: ${APP_URL:-http://localhost:4200}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4200/api/v1/auth/google/callback}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-WhatsAppka <no-reply@localhost>}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    networks:
      - private
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Readiness на служебном порту: 503 при недоступном PostgreSQL. Порт слушает только loopback контейнера.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9090 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  worker:
    logging: *logging
    image: whatsappka-backend:local
    environment:
      SPRING_PROFILES_ACTIVE: worker
      SPRING_MAIN_WEB_APPLICATION_TYPE: servlet
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-whatsappka}
      DB_USERNAME: ${DB_USERNAME:-whatsappka_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-whatsappka-media}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WHATSAPPKA_SECURITY_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WHATSAPPKA_SECURITY_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
      # false нужен для входа по http в локальной сети; за HTTPS ставьте true.
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
      APP_URL: ${APP_URL:-http://localhost:4200}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-WhatsAppka <no-reply@localhost>}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-2}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
    networks:
      - private
      - edge
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9090 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\nHost: 127.0.0.1\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

  frontend:
    logging: *logging
    build:
      context: ./frontend
    image: whatsappka-frontend:local
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:80"
    networks:
      - private
      - edge
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # Локальный SMTP для проверки писем (подтверждение почты, сброс пароля). Включается профилем mail:
  # docker compose --profile mail up -d. Приложению нужны SMTP_HOST=mailpit, SMTP_PORT=1025, SMTP_STARTTLS=false.
  # Перед использованием закрепите образ по digest, как остальные сервисы.
  mailpit:
    logging: *logging
    image: axllent/mailpit:latest
    profiles:
      - mail
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - private
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
