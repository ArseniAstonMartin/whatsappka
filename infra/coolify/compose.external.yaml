# Внешний контур (VM с Coolify). Дополняет compose.yaml и сбрасывает публикацию портов на хост:
#   docker compose --env-file <env> -f compose.yaml -f infra/coolify/compose.external.yaml up -d --build
# В Coolify наружу выходит только статика (порт 80 внутри сети, маршрут настраивает Coolify и владелец домена).
# База, Redis, S3, миграции и почта публикуются только во внутренней сети compose.

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    ports: !reset []

  backend:
    ports: !reset []

  frontend:
    ports: !reset []
    expose:
      - "80"
