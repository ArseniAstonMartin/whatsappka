<label class="label" [class.visually-hidden]="hideLabel()" [attr.for]="inputId">{{ label() }}</label>
@if (multiline()) {
  <textarea
    class="input textarea"
    [class.grow]="autoGrow()"
    [id]="inputId"
    [attr.rows]="rows()"
    [attr.maxlength]="maxLength()"
    [value]="value()"
    [disabled]="disabled()"
    [attr.aria-invalid]="errorText() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  ></textarea>
} @else {
  <input
    class="input"
    [id]="inputId"
    [type]="type()"
    [attr.autocomplete]="autocomplete()"
    [attr.maxlength]="maxLength()"
    [value]="value()"
    [disabled]="disabled()"
    [attr.aria-invalid]="errorText() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
}
@if (errorText()) {
  <p class="error" [id]="inputId + '-error'" role="alert">{{ errorText() }}</p>
} @else if (hint()) {
  <p class="hint" [id]="inputId + '-hint'">{{ hint() }}</p>
}
