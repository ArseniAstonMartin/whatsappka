@if (kind() === 'loading') {
  <div class="panel loading" role="status" aria-live="polite" aria-busy="true">
    <span class="visually-hidden">Загрузка…</span>
    <span class="bar bar-wide"></span>
    <span class="bar"></span>
    <span class="bar bar-short"></span>
  </div>
} @else {
  <section
    class="panel"
    [class.panel-alert]="kind() === 'error' || kind() === 'offline'"
    [attr.role]="kind() === 'error' ? 'alert' : 'status'"
  >
    <h2 class="title">{{ title() }}</h2>
    @if (message()) {
      <p class="message">{{ message() }}</p>
    }
    <ng-content />
  </section>
}
