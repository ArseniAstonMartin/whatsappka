spring:
  main:
    web-application-type: none
    keep-alive: true
  datasource:
    hikari:
      maximum-pool-size: 5

whatsappka:
  jobs:
    worker-enabled: true
    concurrency: ${JOB_CONCURRENCY:2}
    lease: ${JOB_LEASE:PT5M}
  outbox:
    relay-enabled: true
    batch-size: ${OUTBOX_BATCH_SIZE:20}
