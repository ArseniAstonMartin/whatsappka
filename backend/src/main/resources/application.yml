spring:
  application:
    name: whatsappka
  profiles:
    default: backend
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/whatsappka}
    username: ${DB_USERNAME:whatsappka_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  mvc:
    problemdetails:
      enabled: false

  web:
    locale: ru
    locale-resolver: fixed

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 250ms
      timeout: 250ms

whatsappka:
  media:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    region: ${MINIO_REGION:us-east-1}
    bucket: ${MINIO_BUCKET:whatsappka-media}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    start-tls: ${SMTP_STARTTLS:true}
    from: ${MAIL_FROM:WhatsAppka <no-reply@localhost>}
    app-url: ${APP_URL:http://localhost:4200}
