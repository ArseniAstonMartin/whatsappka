spring:
  main:
    web-application-type: servlet
  datasource:
    hikari:
      maximum-pool-size: 10

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

whatsappka:
  security:
    jwt-secret: ${JWT_SECRET:}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
      app-url: ${APP_URL:http://localhost:4200}
  media-limits:
    user-quota-bytes: ${MEDIA_USER_QUOTA_BYTES:268435456}
    global-limit-bytes: ${MEDIA_GLOBAL_LIMIT_BYTES:10737418240}
    min-free-disk-bytes: ${MEDIA_MIN_FREE_DISK_BYTES:5368709120}
    disk-path: ${MEDIA_DISK_PATH:.}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  override-with-generic-response: false
